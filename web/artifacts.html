<!doctype html>
<html lang="en">
  <!--
    A task's Artifacts window: one per task, opened from the task's Artifacts tab.
    Same glass field and title bar as index.html. artifacts.js reads ?task=<id> and #file=<name>
    and mounts the task's files (left) and the open file (right) into #arts.
  -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <script src="themeBoot.js"></script>
    <title>Artifacts · Devis</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body data-page="artifacts">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="ic" viewBox="0 0 16 16" focusable="false">
            <path d="M3.75 1.75h5.5l3 3v9.5h-8.5z"></path>
            <path d="M9.25 1.75v3h3M6 8.5h4M6 11h4"></path>
          </svg>
        </span>
        <span class="brand-name" id="artsTitle">Artifacts</span>
      </div>
    </header>
    <main id="arts" class="aw" aria-label="Artifacts"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="vendor/mermaid.min.js" defer></script>
    <script type="module" src="artifacts.js"></script>
  </body>
</html>
